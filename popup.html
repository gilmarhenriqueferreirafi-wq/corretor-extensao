<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Corretor de Escrita</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    width: 260px;
    padding: 14px;
    background: #1e1e24;
    color: #f2f2f5;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 12px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  label {
    font-size: 13px;
    color: #d5d5db;
  }
  select {
    width: 100%;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #3a3a44;
    background: #2a2a33;
    color: #f2f2f5;
    font-size: 13px;
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
  }
  .switch input { display: none; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #3a3a44;
    border-radius: 22px;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider {
    background: #3d5afe;
  }
  input:checked + .slider::before {
    transform: translateX(18px);
  }
  .mode-group {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .mode-group button {
    flex: 1;
    padding: 6px 4px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid #3a3a44;
    background: #2a2a33;
    color: #d5d5db;
    cursor: pointer;
  }
  .mode-group button.active {
    background: #3d5afe;
    color: white;
    border-color: #3d5afe;
  }
  .footer {
    text-align: center;
    margin-top: 8px;
  }
  .footer a {
    font-size: 12px;
    color: #8a97ff;
    text-decoration: none;
    cursor: pointer;
  }
  .signature {
    text-align: center;
    margin-top: 12px;
    font-size: 10px;
    color: #5a5a66;
  }
</style>
</head>
<body>
  <h1>Corretor de Escrita</h1>

  <div class="row">
    <label for="enabled">Ativo neste navegador</label>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row" style="flex-direction: column; align-items: stretch; gap: 6px;">
    <label>Modo de correção</label>
    <div class="mode-group">
      <button id="mode-auto" data-mode="auto">Automático</button>
      <button id="mode-suggestions" data-mode="suggestions">Sugestões</button>
    </div>
  </div>

  <div class="row" style="flex-direction: column; align-items: stretch; gap: 6px;">
    <label for="language">Idioma</label>
    <select id="language"></select>
  </div>

  <div class="footer">
    <a id="open-options">Mais configurações</a>
  </div>

  <div class="signature">by Gilmar Henrique</div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
